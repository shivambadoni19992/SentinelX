server:
  port: 8080

spring:
  application:
    name: sentinelx-api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  # Redis backing the gateway RequestRateLimiter (same cluster as the services).
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2s
  # Route table is intentionally in the SHARED document (no profile guard) so it
  # loads under every profile (default local runs AND the `docker` profile used
  # by docker-compose). Previously this lived under `on-profile: default` only,
  # which left the gateway with zero routes in Docker -> every /api/** 404'd.
  cloud:
    gateway:
      routes:
        - id: auth
          uri: http://auth-service:8081
          predicates: [ Path=/api/auth/** ]
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${rate-limit.replenish}
                redis-rate-limiter.burstCapacity: ${rate-limit.burst}
                redis-rate-limiter.requestedTokens: 1
        - id: payments
          uri: http://payment-service:8082
          predicates: [ Path=/api/payments/** ]
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${rate-limit.replenish}
                redis-rate-limiter.burstCapacity: ${rate-limit.burst}
                redis-rate-limiter.requestedTokens: 1
        - id: retail
          uri: http://retail-service:8083
          predicates: [ Path=/api/retail/** ]
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${rate-limit.replenish}
                redis-rate-limiter.burstCapacity: ${rate-limit.burst}
                redis-rate-limiter.requestedTokens: 1
        - id: orders
          uri: http://retail-service:8083
          predicates: [ Path=/api/orders/** ]
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${rate-limit.replenish}
                redis-rate-limiter.burstCapacity: ${rate-limit.burst}
                redis-rate-limiter.requestedTokens: 1
        - id: security-events
          uri: http://security-event-service:8084
          predicates: [ Path=/api/security/events, Path=/api/security/events/** ]
          filters:
            - RewritePath=/api/security/(?<segment>.*), /api/$\{segment}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${rate-limit.replenish}
                redis-rate-limiter.burstCapacity: ${rate-limit.burst}
                redis-rate-limiter.requestedTokens: 1
        - id: security-audit
          uri: http://security-event-service:8084
          predicates: [ Path=/api/security/audit-logs, Path=/api/security/audit-logs/** ]
          filters:
            - RewritePath=/api/security/(?<segment>.*), /api/events/$\{segment}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${rate-limit.replenish}
                redis-rate-limiter.burstCapacity: ${rate-limit.burst}
                redis-rate-limiter.requestedTokens: 1
        - id: security
          uri: http://security-event-service:8084
          predicates: [ Path=/api/security/** ]
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${rate-limit.replenish}
                redis-rate-limiter.burstCapacity: ${rate-limit.burst}
                redis-rate-limiter.requestedTokens: 1
        - id: detection
          uri: http://detection-engine:8085
          predicates: [ Path=/api/detections/** ]
        - id: risk
          uri: http://risk-engine:8086
          predicates: [ Path=/api/risk/** ]
        - id: alerts
          uri: http://alert-service:8087
          predicates: [ Path=/api/alerts/** ]
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${rate-limit.replenish}
                redis-rate-limiter.burstCapacity: ${rate-limit.burst}
                redis-rate-limiter.requestedTokens: 1
        - id: simulations
          uri: http://simulation-service:8088
          predicates: [ Path=/api/simulations/** ]
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${rate-limit.replenish}
                redis-rate-limiter.burstCapacity: ${rate-limit.burst}
                redis-rate-limiter.requestedTokens: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
    gateway:
      enabled: true

info:
  service: sentinelx-api-gateway
  env: ${SENTINELX_ENV:local}

# JWT signing/validation. Must match the auth-service secret/issuer so tokens
# issued at /api/auth/login can be validated at the edge.
sentinelx:
  jwt:
    secret: ${SENTINELX_JWT_SECRET:sentinelx-dev-only-secret-change-me-0123456789abcdef}
    issuer: ${SENTINELX_JWT_ISSUER:sentinelx-auth-service}

# Per-route rate limiting (token bucket in Redis). Values are overridable via
# env so tests/e2e can tune them without touching route definitions.
rate-limit:
  replenish: ${RATE_LIMIT_REPLENISH:50}
  burst: ${RATE_LIMIT_BURST:80}

logging:
  level:
    root: INFO
