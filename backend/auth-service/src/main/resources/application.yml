server:
  port: 8081

spring:
  application:
    name: sentinelx-auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/sentinelx}
    username: ${DB_USER:sentinelx}
    password: ${DB_PASSWORD:sentinelx}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: whoami
  flyway:
    enabled: true
    create-schemas: true
    schemas: whoami
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

info:
  service: sentinelx-auth-service
  env: ${SENTINELX_ENV:local}

logging:
  level:
    root: INFO
