server:
  port: 8081

spring:
  application:
    name: sentinelx-auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/sentinelx}
    username: ${DB_USER:sentinelx}
    password: ${DB_PASSWORD:sentinelx}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: whoami
  flyway:
    enabled: true
    create-schemas: true
    schemas: whoami
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

info:
  service: sentinelx-auth-service
  env: ${SENTINELX_ENV:local}

# JWT signing + validation.
# SENTINELX_JWT_SECRET must be at least 32 bytes for HS256. The value below is a
# development-only default; always override it in real deployments.
sentinelx:
  jwt:
    secret: ${SENTINELX_JWT_SECRET:sentinelx-dev-only-secret-change-me-0123456789abcdef}
    ttl-seconds: ${SENTINELX_JWT_TTL_SECONDS:3600}
    issuer: ${SENTINELX_JWT_ISSUER:sentinelx-auth-service}

logging:
  level:
    root: INFO
