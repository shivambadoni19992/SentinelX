server:
  port: 8087

spring:
  application:
    name: sentinelx-alert-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/sentinelx}
    username: ${DB_USER:sentinelx}
    password: ${DB_PASSWORD:sentinelx}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: alerts
  flyway:
    enabled: true
    create-schemas: true
    schemas: alerts
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: sentinelx-alert-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: manual_immediate
      concurrency: 2
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

# Downstream services the response executor drives to change real state.
sentinelx:
  response:
    payment-service-url: ${PAYMENT_SERVICE_URL:http://localhost:8082}
    auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    rate-limit-ttl: PT15M
    verification-ttl: PT24H

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

info:
  service: sentinelx-alert-service
  env: ${SENTINELX_ENV:local}

logging:
  level:
    root: INFO
