server:
  port: 8082

spring:
  application:
    name: sentinelx-payment-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/sentinelx}
    username: ${DB_USER:sentinelx}
    password: ${DB_PASSWORD:sentinelx}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: payments
  flyway:
    enabled: true
    create-schemas: true
    schemas: payments
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    listener:
      auto-startup: false

# Synthetic payment processing tunables.
sentinelx:
  payments:
    hold-threshold: ${PAYMENT_HOLD_THRESHOLD:10000.00}
    decline-threshold: ${PAYMENT_DECLINE_THRESHOLD:100000.00}
    hold-risk-percent: ${PAYMENT_HOLD_RISK_PERCENT:10}
    decline-risk-percent: ${PAYMENT_DECLINE_RISK_PERCENT:3}
    event-topic: ${PAYMENT_EVENT_TOPIC:security.payment}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

info:
  service: sentinelx-payment-service
  env: ${SENTINELX_ENV:local}

logging:
  level:
    root: INFO
