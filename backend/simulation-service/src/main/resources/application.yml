server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: sentinelx-simulation-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/sentinelx}
    username: ${DB_USER:sentinelx}
    password: ${DB_PASSWORD:sentinelx}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: simulator
  flyway:
    enabled: true
    create-schemas: true
    schemas: simulator
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
        compression.type: lz4
    consumer:
      group-id: sentinelx-simulation-tracker
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      properties:
        max.poll.records: 500
    listener:
      ack-mode: manual_immediate
      concurrency: 1

# Safe upper limits enforced when a SimulationConfig is validated.
sentinelx:
  simulation:
    max-concurrent-runs: 4
    limits:
      max-users: 10000
      max-devices: 10000
      max-ip-addresses: 10000
      max-duration-seconds: 600
      max-events-per-second: 1000
      max-total-events: 50000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

info:
  service: sentinelx-simulation-service
  env: ${SENTINELX_ENV:local}

logging:
  level:
    root: INFO
