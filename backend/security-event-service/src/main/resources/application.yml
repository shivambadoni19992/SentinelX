server:
  port: 8084

spring:
  application:
    name: sentinelx-security-event-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/sentinelx}
    username: ${DB_USER:sentinelx}
    password: ${DB_PASSWORD:sentinelx}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: events
  flyway:
    enabled: true
    create-schemas: true
    schemas: events
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: sentinelx-security-event-normalizer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      properties:
        max.poll.records: 200
        isolation.level: read_committed
    listener:
      ack-mode: manual_immediate
      concurrency: 2
    producer:
      # Producer used by the dead-letter recoverer.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

# Kafka event topology consumed by this service.
sentinelx:
  security-events:
    topics:
      - security.auth
      - security.payment
      - security.api
      - security.retail
      - security.network
      - security.risk
      - security.alert
      - security.audit


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

info:
  service: sentinelx-security-event-service
  env: ${SENTINELX_ENV:local}

logging:
  level:
    root: INFO
