server:
  port: 8084

spring:
  application:
    name: sentinelx-security-event-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

info:
  service: sentinelx-security-event-service
  env: ${SENTINELX_ENV:local}

logging:
  level:
    root: INFO
